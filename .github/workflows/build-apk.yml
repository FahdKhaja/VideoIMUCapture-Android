name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK already; setup-android only gets in the
      # way (it insists on the long-obsolete "tools" package). All this needs is the
      # platform and build-tools the project compiles against.
      - name: Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build the debug APK
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoIMUCapture-debug-apk
          path: android_app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
